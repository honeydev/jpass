services:
  postgres:
    image: postgres:17-alpine
    container_name: jpass-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jpass}
      POSTGRES_USER: ${POSTGRES_USER:-jpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jpass}
    ports:
      - "${POSTGRES_PORT:-5481}:5432"
    volumes:
      - ./postgres_data_v17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_v17:
