spring:
  application:
    name: jpass
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5481/jpass}
    username: ${SPRING_DATASOURCE_USERNAME:jpass}
    password: ${SPRING_DATASOURCE_PASSWORD:jpass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

jpass:
  security:
    jwt:
      secret: ${JPASS_JWT_SECRET:change-this-development-secret-at-least-32-chars}
      expiration: ${JPASS_JWT_EXPIRATION:3600}
